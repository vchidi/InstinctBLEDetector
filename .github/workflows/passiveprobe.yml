name: Instinct BLE Passive (Android phone)
on:
  workflow_dispatch:
  push:
    branches: [experiment/passive-ble-only, experiment/pre-replacement-gatt]
    paths:
      - 'passiveprobe/**'
      - 'settings.gradle'
      - '.github/workflows/passiveprobe.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :passiveprobe:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: InstinctBLEPassive-phone-apk
          path: passiveprobe/build/outputs/apk/debug/passiveprobe-debug.apk
