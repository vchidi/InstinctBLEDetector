name: NFC Info Probe APK

on:
  push:
    branches:
      - experiment/nfc-info-only
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build phone NFC APK
        run: gradle --no-daemon :nfcprobe:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InstinctNFCInfo-android-phone-apk
          path: nfcprobe/build/outputs/apk/debug/nfcprobe-debug.apk
