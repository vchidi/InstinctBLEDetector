name: Offline glucose frame tests
on:
  workflow_dispatch:
  push:
    branches: [experiment/passive-ble-only, experiment/pre-replacement-gatt]
    paths:
      - 'passiveprobe/src/main/java/com/lucyago/instinctpassive/GlucoseFrameAssembler.java'
      - 'passiveprobe/src/main/java/com/lucyago/instinctpassive/GlucosePipeline.java'
      - 'passiveprobe/src/main/java/com/lucyago/instinctpassive/OfflineFrameSelfTest.java'
      - '.github/workflows/offline-framing.yml'
      - 'passiveprobe/src/main/java/com/lucyago/instinctpassive/GlucoseReading.java'
      - 'passiveprobe/src/main/java/com/lucyago/instinctpassive/AuthenticatedGlucoseDecoder.java'
      - 'passiveprobe/src/main/java/com/lucyago/instinctpassive/InstinctGoDecoder.java'
      - 'passiveprobe/src/main/java/com/lucyago/instinctpassive/GlucoseReadingValidator.java'
      - 'passiveprobe/src/main/java/com/lucyago/instinctpassive/OfflineGlucosePipeline.java'
      - 'passiveprobe/src/main/java/com/lucyago/instinctpassive/OfflineDecoderSelfTest.java'
      - 'passiveprobe/src/main/java/com/lucyago/instinctpassive/Libre3GattFingerprint.java'
      - 'passiveprobe/src/main/java/com/lucyago/instinctpassive/GattFingerprintSelfTest.java'
      - 'passiveprobe/src/main/java/com/lucyago/instinctpassive/VerifiedSessionGlucosePath.java'
      - 'passiveprobe/src/main/java/com/lucyago/instinctpassive/VerifiedSessionGlucosePathSelfTest.java'
      - 'passiveprobe/src/main/java/com/lucyago/instinctpassive/SessionGate.java'
      - 'passiveprobe/src/main/java/com/lucyago/instinctpassive/OfflineGlucoseTransport.java'
      - 'passiveprobe/src/main/java/com/lucyago/instinctpassive/OfflineTransportSelfTest.java'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and run offline framing test
        run: |
          mkdir -p /tmp/instinct-offline-test
          javac -d /tmp/instinct-offline-test \
            passiveprobe/src/main/java/com/lucyago/instinctpassive/GlucoseFrameAssembler.java \
            passiveprobe/src/main/java/com/lucyago/instinctpassive/GlucosePipeline.java \
            passiveprobe/src/main/java/com/lucyago/instinctpassive/OfflineFrameSelfTest.java \
            passiveprobe/src/main/java/com/lucyago/instinctpassive/SessionGate.java \
            passiveprobe/src/main/java/com/lucyago/instinctpassive/OfflineGlucoseTransport.java \
            passiveprobe/src/main/java/com/lucyago/instinctpassive/OfflineTransportSelfTest.java \
            passiveprobe/src/main/java/com/lucyago/instinctpassive/GlucoseReading.java \
            passiveprobe/src/main/java/com/lucyago/instinctpassive/AuthenticatedGlucoseDecoder.java \
            passiveprobe/src/main/java/com/lucyago/instinctpassive/InstinctGoDecoder.java \
            passiveprobe/src/main/java/com/lucyago/instinctpassive/GlucoseReadingValidator.java \
            passiveprobe/src/main/java/com/lucyago/instinctpassive/OfflineGlucosePipeline.java \
            passiveprobe/src/main/java/com/lucyago/instinctpassive/OfflineDecoderSelfTest.java \
            passiveprobe/src/main/java/com/lucyago/instinctpassive/Libre3GattFingerprint.java \
            passiveprobe/src/main/java/com/lucyago/instinctpassive/GattFingerprintSelfTest.java \
            passiveprobe/src/main/java/com/lucyago/instinctpassive/VerifiedSessionGlucosePath.java \
            passiveprobe/src/main/java/com/lucyago/instinctpassive/VerifiedSessionGlucosePathSelfTest.java
          java -cp /tmp/instinct-offline-test com.lucyago.instinctpassive.OfflineFrameSelfTest
          java -cp /tmp/instinct-offline-test com.lucyago.instinctpassive.OfflineTransportSelfTest
          java -cp /tmp/instinct-offline-test com.lucyago.instinctpassive.OfflineDecoderSelfTest
          java -cp /tmp/instinct-offline-test com.lucyago.instinctpassive.GattFingerprintSelfTest
          java -cp /tmp/instinct-offline-test com.lucyago.instinctpassive.VerifiedSessionGlucosePathSelfTest
